/* ---- resumen de fin de mes para el paciente ---- */
function resumenMes(pacienteId, mes){
  const cs = ordenar(db.consultas.filter(c =>
    c.pacienteId === pacienteId && String(c.fecha).slice(0,7) === mes));
  const cobradas = cs.filter(seCobra);
  return {
    asistidas: cs.filter(c=>c.estado==="asistio").length,
    faltas: cs.filter(c=>c.estado==="falto").length,
    faltasCobradas: db.config.cobrarFaltas ? cs.filter(c=>c.estado==="falto").length : 0,
    cantidad: cobradas.length,
    total: cobradas.reduce((a,c)=>a+importeDe(c), 0),
    pendientes: cs.filter(c=>c.estado==="pendiente").length,
    sinPrecio: cobradas.filter(c=>!importeDe(c)).length,
    fechas: cobradas.map(c=>corta(c.fecha))
  };
}

const claveAviso = (pacienteId, mes) => mes + ":" + pacienteId;
const avisado = (pacienteId, mes) => !!(db.avisos && db.avisos[claveAviso(pacienteId, mes)]);

function mensajeCierre(pacienteId, mes){
  const p = paciente(pacienteId);
  const r = resumenMes(pacienteId, mes);
  const nom = MESES[+mes.slice(5,7)-1];
  return String(db.config.plantillaCierre || CONFIG_DEF.plantillaCierre)
    .replace(/\{nombre\}/g, pilaDe(pacienteId))
    .replace(/\{nombreCompleto\}/g, nombreLargo(p))
    .replace(/\{mes\}/g, nom)
    .replace(/\{anio\}/g, mes.slice(0,4))
    .replace(/\{cantidad\}/g, r.cantidad)
    .replace(/\{asistidas\}/g, r.asistidas)
    .replace(/\{faltas\}/g, r.faltasCobradas)
    .replace(/\{detalle\}/g, r.fechas.join(", "))
    .replace(/\{total\}/g, plata(r.total))
    .replace(/\{arancel\}/g, plata(p && p.arancel ? p.arancel : 0));
}

function pantallaCierres(mes){
  const filas = datosMes(mes).filter(r => r.importe || r.asistio);
  const nom = MESES[+mes.slice(5,7)-1] + " de " + mes.slice(0,4);
  if (!filas.length){
    abrir(`<h3>Resúmenes de ${nom}</h3>
      <div class="ocupadas">No hay consultas cobrables en ese mes.</div>

    return;
  }
  const listos = filas.filter(r=>avisado(r.id, mes)).length;
  const lista = filas.map(r=>{
    const p = paciente(r.id);
    const ok = avisado(r.id, mes);
    return `<button class="fichaLinea${ok?" hecho":""}" data-cierre="${r.id}">
      <span class="ini">${esc(inicialesDe(paciente(r.id)) )}</span>
      <span class="txt"><b>${esc(r.nombre)}</b>
        <span>${r.asistio} consulta${r.asistio===1?"":"s"}${!p||!p.telefono?" · sin teléfono":""}</span></span>
      <span class="der"><b class="num plata">${plata(r.importe)}</b>
        <span>${ok?"enviado":"pendiente"}</span></span>
    </button>`;
  }).join("");

  abrir(`<h3>Resúmenes de ${nom}</h3>
    <div class="sub">${listos} de ${filas.length} enviados. Tocá cada paciente para ver y mandar el mensaje.</div>
    <div class="listaSel">${lista}</div>
    <button class="btn sec" id="cCerrar">Cerrar</button>`);
  $("#cCerrar").onclick = cerrar;

    b.addEventListener("click", ()=> avisoCierre(b.dataset.cierre, mes, true)));

function avisoCierre(pacienteId, mes, desdeLista){
  const p = paciente(pacienteId);
  if (!p) return;
  const r = resumenMes(pacienteId, mes);
  const nom = MESES[+mes.slice(5,7)-1];
  const texto = mensajeCierre(pacienteId, mes);
  const tel = p.telefono ? telWhatsApp(p.telefono) : "";
  const link = tel ? "https://wa.me/"+tel+"?text="+encodeURIComponent(texto) : "";
  const ok = avisado(pacienteId, mes);

  const alertas = [];
  if (r.pendientes) alertas.push(r.pendientes+" consulta"+(r.pendientes===1?"":"s")+" de ese mes sigue"+(r.pendientes===1?"":"n")+" sin marcar, así que el total puede estar incompleto.");
  if (r.sinPrecio) alertas.push(r.sinPrecio+" consulta"+(r.sinPrecio===1?"":"s")+" sin importe cargado.");

  abrir(`<h3>Resumen de ${esc(nom)}</h3>
    <div class="sub">${esc(nombreLargo(p))} · ${r.asistidas} asistida${r.asistidas===1?"":"s"}${
      r.faltasCobradas?" · "+r.faltasCobradas+" falta"+(r.faltasCobradas===1?"":"s")+" cobrada"+(r.faltasCobradas===1?"":"s"):""} · ${plata(r.total)}</div>
    ${alertas.length?`<div class="aviso">${alertas.map(esc).join("<br>")}</div>`:""}
    <label>Mensaje</label>
    <div class="previo">${esc(texto)}</div>
    ${link
      ? `<a class="btn" href="${link}" target="_blank" rel="noopener" id="cWA">Enviar por WhatsApp</a>`
      : `<div class="ocupadas">Este paciente no tiene teléfono cargado. Podés copiar el mensaje y mandarlo por otra vía.</div>`}
    <button class="btn sec" id="cCopiar">Copiar el mensaje</button>
    <button class="btn sec" id="cMarcar">${ok?"Marcar como no enviado":"Marcar como enviado"}</button>
    <button class="btn sec" id="cVolver">${desdeLista?"Volver a la lista":"Cerrar"}</button>`);

  async function marcar(v){
    if (v) db.avisos[claveAviso(pacienteId, mes)] = Date.now();
    else delete db.avisos[claveAviso(pacienteId, mes)];
    await persistir();
  }
  if (link) $("#cWA").onclick = async ()=>{
    await marcar(true);
    setTimeout(()=> desdeLista ? pantallaCierres(mes) : cerrar(), 700);
  };
  $("#cCopiar").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(texto); toast("Mensaje copiado"); }
    catch(e){ prompt("Copiá el mensaje:", texto); }
  };
  $("#cMarcar").onclick = async ()=>{
    await marcar(!ok);
    toast(ok ? "Marcado como no enviado" : "Marcado como enviado");
    desdeLista ? pantallaCierres(mes) : avisoCierre(pacienteId, mes, false);
  };
  $("#cVolver").onclick = ()=> desdeLista ? pantallaCierres(mes) : cerrar();
}

/* ---- alquiler de salas ---- */
/* Solo lo usa quien administra el cobro. Se calcula con lo que la planilla
   compartida ya publica: nunca toca datos de pacientes ajenos. */
function horasTxt(h){
  const n = Math.round(h*100)/100;
  return (Number.isInteger(n) ? String(n) : String(n).replace(".", ",")) ;
}

function alquilerMes(mes){
  const precios = db.config.alquiler || {};
  const porInquilina = new Map();
  ajenas.forEach(r=>{
    const cfg = precios[r.propietaria];
    if (!cfg || !(Number(cfg.precio) > 0)) return;
    if (String(r.fecha).slice(0,7) !== mes) return;
    if (r.estado === "cancelada") return;          // cancelar libera la sala
    if (!porInquilina.has(r.propietaria))
      porInquilina.set(r.propietaria, {
        profId: r.propietaria, nombre: r.prof || cfg.nombre || "(sin nombre)",
        precio: Number(cfg.precio), minutos: 0, reservas: []
      });
    const f = porInquilina.get(r.propietaria);
    f.minutos += Math.max(0, parseInt(r.dur,10) || 0);
    f.reservas.push({ fecha:r.fecha, hora:r.hora, dur:r.dur, sala:r.sala });
  });
  const filas = [...porInquilina.values()].map(f=>{
    f.horas = f.minutos/60;
    f.total = Math.round(f.horas * f.precio);
    f.reservas.sort((a,b)=> (a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    return f;
  }).sort((a,b)=> b.total - a.total || a.nombre.localeCompare(b.nombre));
  return {
    filas: filas,
    horas: filas.reduce((a,f)=>a+f.horas, 0),
    total: filas.reduce((a,f)=>a+f.total, 0),
    hay: Object.keys(precios).some(k => Number(precios[k] && precios[k].precio) > 0)
  };
}

function textoAlquiler(profId, mes){
  const f = alquilerMes(mes).filas.find(x=>x.profId===profId);
  const nom = MESES[+mes.slice(5,7)-1] + " de " + mes.slice(0,4);
  if (!f) return "Alquiler de salas — " + nom + "\nSin horas reservadas.";
  return "Alquiler de salas — " + nom + "\n" + f.nombre + "\n" +
    horasTxt(f.horas) + " h reservadas · " + plata(f.precio) + " por hora\n" +
    "Total: " + plata(f.total) + "\n\n" +
    f.reservas.map(r =>
      corta(r.fecha) + " " + diaCorto(r.fecha) + " " + r.hora +
      " · sala " + salaDe(r.sala).nombre + " · " + durTxt(r.dur)
    ).join("\n");
}

/* ---- cierre de mes ---- */
function datosMes(mes){
  const cs = db.consultas.filter(c=>String(c.fecha).slice(0,7)===mes);
  const mapa = new Map();
  cs.forEach(c=>{
    const k = c.pacienteId;
    if (!mapa.has(k)) mapa.set(k, {id:k, nombre: nombreDe(k), asistio:0, falto:0, pendiente:0, cancelada:0, total:0, importe:0, sinPrecio:0});
    const r = mapa.get(k);
    r.total++;
    if (c.estado==="asistio") r.asistio++;
    else if (c.estado==="falto") r.falto++;
    else if (c.estado==="cancelada") r.cancelada++;
    else r.pendiente++;
    if (seCobra(c)){
      const v = importeDe(c);
      r.importe += v;
      if (!v) r.sinPrecio++;
    }
  });
  return [...mapa.values()].sort((a,b)=> b.importe-a.importe || b.asistio-a.asistio || a.nombre.localeCompare(b.nombre));
}

function mesSumar(m, n){
  const d = new Date(+m.slice(0,4), +m.slice(5,7)-1+n, 1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}

const esIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

async function bajar(texto, nombre, tipo){
  const blob = new Blob([texto], {type: tipo+";charset=utf-8"});
  // En iOS la descarga directa falla o se pierde, sobre todo con la app instalada:
  // se usa la hoja de compartir, que deja guardar en Archivos o mandarlo por mail.
  if (esIOS && navigator.canShare){
    try{
      const f = new File([blob], nombre, {type: tipo});
      if (navigator.canShare({files:[f]})){
        await navigator.share({files:[f], title: nombre});
        return;
      }
    }catch(e){
      if (e && e.name === "AbortError") return;   // el usuario cerró la hoja
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast("Archivo generado");
}

/* ---- ajustes ---- */
function seccionAlquiler(){
  const guardados = db.config.alquiler || {};
  /* Se listan las profesionales vistas en la planilla más las que ya tengan
     precio, para no perder a alguien que este mes no reservó nada. */
  const vistas = new Map();
  ajenas.forEach(r=>{ if (r.propietaria) vistas.set(r.propietaria, r.prof || "(sin nombre)"); });
  Object.keys(guardados).forEach(k=>{
    if (!vistas.has(k)) vistas.set(k, (guardados[k] && guardados[k].nombre) || "(sin nombre)");
  });

  if (!vistas.size){
    return `<div class="ocupadas">Todavía no llegaron reservas de otras psicólogas.
      Sincronizá la planilla y volvé acá.</div>`;
  }
  const filas = [...vistas.entries()]
    .sort((a,b)=> a[1].localeCompare(b[1]))
    .map(([id,nom])=>{
      const p = guardados[id] && Number(guardados[id].precio) ? guardados[id].precio : "";
      return `<label for="pr_${esc(id)}">${esc(nom)}</label>
        <input type="number" id="pr_${esc(id)}" inputmode="numeric" min="0" step="1"
          data-precio="${esc(id)}" data-nombre="${esc(nom)}" value="${esc(p)}"
          placeholder="precio por hora en ${esc(db.config.moneda||"$")}">`;
    }).join("");
  return filas + `<button class="btn" id="aAlqG">Guardar precios</button>
    <div class="sub" style="margin-top:10px">Quien no tenga precio cargado no se factura.
    Estos precios quedan solo en tu Drive: las demás no los ven.</div>`;
}

function diagnostico(){
  const id = db.config.driveId || "";
  const corto = id ? (id.slice(0,14) + "…" + id.slice(-28) + "  (" + id.length + " caracteres)") : "(vacío)";
  const mal = revisarClienteId(id);
  const inst = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
               navigator.standalone === true;
  const ua = navigator.userAgent || "";
  const dentroDeApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)/.test(ua);
  const L = [];
  L.push("— Diagnóstico de la agenda —");
  L.push("Origen: " + (location.origin || (location.protocol + "//" + location.host)));
  L.push("Dirección: " + location.href.split("?")[0]);
  L.push("Instalada como app: " + (inst ? "sí" : "no (pestaña del navegador)"));
  L.push("Navegador embebido: " + (dentroDeApp ? "SÍ — abrila en Chrome o Safari, Google bloquea estos" : "no"));
  L.push("ID de cliente: " + corto);
  L.push("ID fijado en el archivo: " + (CONSULTORIO.clienteId ? "sí" : "no"));
  L.push("Revisión del ID: " + (mal || "formato correcto"));
  L.push("ID de planilla: " + (db.config.hojaId ? db.config.hojaId.slice(0,10)+"… ("+db.config.hojaId.length+")" : "(vacío)"));
  L.push("Nombre profesional: " + (db.config.profNombre || "(sin cargar)"));
  L.push("Tu identificador: " + (db.config.profId || "(sin generar)"));
  /* Este aviso aparece solo mientras la lista está vacía, es decir durante la
     puesta a punto. Una vez cargado un identificador, deja de mostrarse: así
     el estado no queda mudo, pero tampoco queda un cartel permanente. */
  if (!(CONSULTORIO.administradoras || []).length)
    L.push("Alquiler de salas: sin configurar — para verlo, agregá el identificador de arriba a `administradoras` en index.html");
  else if (esAdministradora())
    L.push("Alquiler de salas: activo");
  L.push("Librería de Google cargada: " + (window.google && google.accounts ? "sí" : "NO"));
  if (!Sync.token) Sync.recuperarToken();
  L.push("Sesión de Google: " + (Sync.token && Date.now() < Sync.expira
    ? "activa hasta las " + new Date(Sync.expira).toTimeString().slice(0,5)
    : "sin token (va a pedir la cuenta)"));
  L.push("Drive: " + Sync.texto() + (Sync.detalle ? " · " + Sync.detalle : ""));
  L.push("Planilla: " + (Salas.detalle || (Salas.ultima ? "al día" : "sin sincronizar")));
  L.push("Datos: " + db.pacientes.length + " pacientes, " + db.consultas.length + " consultas");
  L.push("Navegador: " + ua.slice(0,110));
  return L.join("\n");
}

function vistaAjustes(){
  const opsPaso = [15,20,30,60].map(m=>`<option value="${m}" ${(parseInt(db.config.paso,10)||30)===m?"selected":""}>${durTxt(m)}</option>`).join("");
  const opsDur = [15,20,30,45,60,90,120].map(m=>`<option value="${m}" ${(parseInt(db.config.duracion,10)||60)===m?"selected":""}>${durTxt(m)}</option>`).join("");
  $("#vista").innerHTML = `<h2 class="titulo">Ajustes</h2>
    <div class="hoja">
      <h3>Horario de atención</h3>
      <div class="periodo">Define la grilla de la vista Día.</div>
      <div class="dosCol">
        <div><label for="aIni">Desde</label><input type="time" id="aIni" value="${esc(db.config.horaInicio)}"></div>
        <div><label for="aFin">Hasta</label><input type="time" id="aFin" value="${esc(db.config.horaFin)}"></div>
      </div>
      <div class="dosCol">
        <div><label for="aPaso">Franjas de</label><select id="aPaso">${opsPaso}</select></div>
        <div><label for="aDur">Duración típica</label><select id="aDur">${opsDur}</select></div>
      </div>
      <button class="btn" id="aGuardarH">Guardar horario</button>
    </div>
    <div class="hoja" style="margin-top:14px">
      <h3>Cobros</h3>
      <div class="periodo">Cómo se arma el total del cierre mensual.</div>
      <label for="aMon">Símbolo de moneda</label>
      <input type="text" id="aMon" value="${esc(db.config.moneda||"$")}" maxlength="4">
      <label class="check"><input type="checkbox" id="aFaltas" ${db.config.cobrarFaltas?"checked":""}> Cobrar también las consultas a las que el paciente faltó</label>
      <button class="btn" id="aGuardarC">Guardar cobros</button>
    </div>
    <div class="hoja" style="margin-top:14px">
      <label for="aCc">Código de país para WhatsApp</label>
      <input type="text" id="aCc" value="${esc(db.config.codigoPais)}" inputmode="numeric">
      <label for="aPla">Mensaje de recordatorio</label>
      <textarea id="aPla" style="min-height:110px">${esc(db.config.plantilla)}</textarea>
      <label for="aPlaC">Mensaje de cambio de cita</label>
      <textarea id="aPlaC" style="min-height:110px">${esc(db.config.plantillaCambio)}</textarea>
      <div class="sub" style="margin:8px 0 0">En los dos de arriba podés usar {nombre}, {nombreCompleto}, {dia}, {fecha} y {hora}.</div>
      <label for="aPlaR">Mensaje de resumen de fin de mes</label>
      <textarea id="aPlaR" style="min-height:120px">${esc(db.config.plantillaCierre)}</textarea>
      <div class="sub" style="margin:8px 0 0">Acá podés usar {nombre}, {nombreCompleto}, {mes}, {anio}, {cantidad}, {asistidas}, {faltas}, {detalle}, {arancel} y {total}.</div>
      <button class="btn" id="aGuardar">Guardar mensajes</button>
    </div>
    <h2 class="titulo" style="margin-top:22px">Consultorio compartido</h2>
    <div class="sub">Tu nombre y la planilla que ven todas las psicólogas.</div>
    <div class="hoja">
      <label for="aProf">Tu nombre profesional</label>
      <input type="text" id="aProf" value="${esc(db.config.profNombre||"")}" placeholder="Ej. Lucía Fernández">
      <div class="sub" style="margin:6px 0 0">Es lo único que ven las demás en tus horas reservadas.</div>
      <label for="aHoja">ID de la planilla compartida</label>
      <input type="text" id="aHoja" value="${esc(db.config.hojaId||"")}" placeholder="1AbC...xyz" autocomplete="off" spellcheck="false">
      <label for="aSala">Sala que usás más seguido</label>
      <select id="aSala">${SALAS.map(x=>`<option value="${x.id}" ${(db.config.salaDef||"naranja")===x.id?"selected":""}>${x.nombre}</option>`).join("")}</select>
      <button class="btn" id="aEqG">Guardar</button>
      ${Salas.detalle
        ? `<div class="aviso" style="margin-top:10px"><b>La planilla no sincronizó.</b><br>${esc(Salas.detalle)}</div>
           <button class="btn sec" id="aSalasR">Reintentar la planilla</button>`
        : `<div class="ocupadas" style="margin-top:10px">Reservas de las demás: <b>${ajenas.length}</b> cargadas${Salas.ultima?" · al día":""}</div>`}
    </div>

    ${esAdministradora() ? `<h2 class="titulo" style="margin-top:22px">Alquiler de salas</h2>
    <div class="sub">Precio por hora de cada inquilina. Queda solo en tu Drive.</div>
    <div class="hoja">${seccionAlquiler()}</div>` : ""}

    <h2 class="titulo" style="margin-top:22px">Sincronizar con Google Drive</h2>
    <div class="sub">Para usar la misma agenda en el celular y en la PC.</div>
    <div class="hoja">
      <div id="sincCaja">${Sync.cajaHTML()}</div>
      <label for="aDrv">ID de cliente de Google (OAuth)</label>
      <input type="text" id="aDrv" value="${esc(db.config.driveId||"")}" placeholder="000000-xxxx.apps.googleusercontent.com" autocomplete="off" spellcheck="false">
      <div class="sub" style="margin:6px 0 0">Lo sacás de tu propio proyecto en Google Cloud. Está explicado en el instructivo que viene con la app.</div>
      <button class="btn" id="aDrvG">Guardar y conectar</button>
      <button class="btn sec" id="aSinc">Sincronizar ahora</button>
      ${db.config.driveId?`<button class="btn sec" id="aDrvOff">Desconectar Drive</button>`:""}
    </div>

    <h2 class="titulo" style="margin-top:22px">Copia de seguridad</h2>    <div class="sub">Los datos viven solamente en este teléfono. Guardá una copia cada tanto.</div>
    <button class="btn sec" id="aExp">Exportar todo a un archivo</button>
    <button class="btn sec" id="aImp">Restaurar desde un archivo</button>
    <input type="file" id="aFile" accept="application/json,.json" hidden>
    <button class="btn peligro" id="aBorrar" style="margin-top:22px">Borrar todos los datos</button>
    <h2 class="titulo" style="margin-top:22px">Diagnóstico</h2>
    <div class="sub">Si algo falla, mandá esto a quien administra la app.</div>
    <div class="hoja">
      <div class="diag">${esc(diagnostico())}</div>
      <button class="btn sec" id="aDiag">Copiar diagnóstico</button>
    </div>

    <div class="sub" style="margin-top:18px;text-align:center">${db.pacientes.length} pacientes · ${db.consultas.length} consultas</div>`;

  $("#aGuardarH").onclick = async ()=>{
    const i = $("#aIni").value || "08:00", f = $("#aFin").value || "20:00";
    if (minutos(f) <= minutos(i)){ toast("La hora final tiene que ser mayor"); return; }
    db.config.horaInicio = i;
    db.config.horaFin = f;
    db.config.paso = parseInt($("#aPaso").value,10) || 30;
    db.config.duracion = parseInt($("#aDur").value,10) || 60;
    selloConfig();
    await persistir(); toast("Horario guardado"); vistaAjustes();
  };
  $("#aGuardarC").onclick = async ()=>{
    db.config.moneda = $("#aMon").value.trim() || "$";
    db.config.cobrarFaltas = $("#aFaltas").checked;
    selloConfig();
    await persistir(); toast("Cobros guardados"); vistaAjustes();
  };
  $("#aGuardar").onclick = async ()=>{
    db.config.codigoPais = $("#aCc").value.replace(/\D/g,"") || "598";
    db.config.plantilla = $("#aPla").value.trim() || CONFIG_DEF.plantilla;
    db.config.plantillaCambio = $("#aPlaC").value.trim() || CONFIG_DEF.plantillaCambio;
    db.config.plantillaCierre = $("#aPlaR").value.trim() || CONFIG_DEF.plantillaCierre;
    selloConfig();
    await persistir(); toast("Mensajes guardados"); vistaAjustes();
  };
  document.querySelectorAll("[data-precio]").forEach(i=> i.addEventListener("change", ()=>{}));
  if ($("#aAlqG")) $("#aAlqG").onclick = async ()=>{
    const nuevo = {};
    document.querySelectorAll("[data-precio]").forEach(i=>{
      const v = parseInt(i.value,10) || 0;
      nuevo[i.dataset.precio] = { nombre: i.dataset.nombre || "", precio: v };
    });
    db.config.alquiler = nuevo;
    selloConfig();
    await persistir();
    toast("Precios guardados");
    vistaAjustes();
  };
  $("#aEqG").onclick = async ()=>{
    db.config.profNombre = $("#aProf").value.trim();
    db.config.hojaId = $("#aHoja").value.trim().replace(/^.*\/d\/([^/]+).*$/, "$1");
    const malH = revisarHojaId(db.config.hojaId);
    if (malH){ toast(malH); }
    db.config.salaDef = $("#aSala").value || "naranja";
    selloConfig();
    await persistir();
    if (db.config.hojaId && !db.config.profNombre) toast("Cargá tu nombre para que las demás sepan de quién es la hora");
    else toast("Guardado");
    vistaAjustes();
    Salas.correr(false).then(()=> vistaAjustes());
  };
  if ($("#aSalasR")) $("#aSalasR").onclick = ()=>{
    Salas.fallos = 0; Sync.silencioUsado = false;
    Salas.correr(true).then(()=> vistaAjustes());
  };
  $("#aDrvG").onclick = ()=>{
    const id = $("#aDrv").value.trim();
    const mal = id ? revisarClienteId(id) : "";
    if (mal && !confirm(mal + "\n\n¿Guardar igual?")) return;
    db.config.driveId = id;
    selloConfig();
    Sync.olvidarToken(); Sync.fileId = null; Sync.cliente = null; Sync.ultima = 0;
    Store.guardar(db);   // sin await: un await acá rompe el gesto y Safari bloquea la ventana de Google
    if (!id){ Sync.marcar("off"); vistaAjustes(); toast("Drive desconectado"); return; }
    Sync.correr(true, true).then(()=> vistaAjustes());   // conexión inicial: pide permisos
  };
  $("#aSinc").onclick = ()=>{
    if (!db.config.driveId){ toast("Primero cargá el ID de cliente"); return; }
    Sync.fallos = 0; Salas.fallos = 0; Sync.silencioUsado = false;
    Sync.correr(true)
      .then(()=> db.config.hojaId ? Salas.correr(false) : null)
      .then(()=> vistaAjustes());
  };
  if ($("#aDrvOff")) $("#aDrvOff").onclick = async ()=>{
    if (!confirm("Se deja de sincronizar. Los datos siguen en este dispositivo y en Drive. ¿Seguir?")) return;
    db.config.driveId = ""; selloConfig();
    Sync.olvidarToken(); Sync.fileId = null; Sync.cliente = null; Sync.ultima = 0;
    Sync.marcar("off");
    await Store.guardar(db); vistaAjustes(); toast("Drive desconectado");
  };
  $("#aDiag").onclick = async ()=>{
    try{ await navigator.clipboard.writeText(diagnostico()); toast("Diagnóstico copiado"); }
    catch(e){ prompt("Copiá esto:", diagnostico()); }
  };
  $("#aExp").onclick = ()=> bajar(JSON.stringify(db,null,2), "respaldo-consultorio-"+hoyISO()+".json", "application/json");
  $("#aImp").onclick = ()=> $("#aFile").click();
  $("#aFile").onchange = e=>{
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      try{
        const d = JSON.parse(r.result);
        if (!d || !Array.isArray(d.pacientes) || !Array.isArray(d.consultas)) throw new Error("formato");
        if (!confirm("Se reemplazan los datos actuales por los del archivo. ¿Seguir?")) return;
        const viejos = db.pacientes.map(x=>x.id).concat(db.consultas.map(x=>x.id));
        const nuevos = new Set(d.pacientes.map(x=>x.id).concat(d.consultas.map(x=>x.id)));
        db = {
          pacientes: d.pacientes.map(sello), consultas: d.consultas.map(sello),
          config: Object.assign({}, CONFIG_DEF, d.config||{}),
          configMod: Date.now(), borrados: Object.assign({}, db.borrados)
        };
        viejos.forEach(id=>{ if (!nuevos.has(id)) tumba(id); });
        await persistir(true); render(); toast("Datos restaurados");
      }catch(err){ alert("El archivo no tiene el formato esperado. Usá uno exportado desde esta app."); }
    };
    r.readAsText(f);
  };
  $("#aBorrar").onclick = async ()=>{
    if (!confirm("Se borran todos los pacientes y consultas de este teléfono. ¿Seguir?")) return;
    if (!confirm("Confirmá una vez más: esto no se puede deshacer.")) return;
    db.pacientes.concat(db.consultas).forEach(x=> tumba(x.id));
    db = {
      pacientes:[], consultas:[], config:Object.assign({},CONFIG_DEF, {driveId: db.config.driveId||""}),
      configMod: Date.now(), borrados: db.borrados
    };
    await persistir(true); render(); toast("Datos borrados");
  };
}

/* ============ arranque ============ */
(async function init(){
  const d = new Date();
  $("#hoyTexto").textContent = DIAS[d.getDay()]+" "+d.getDate()+" de "+MESES[d.getMonth()];
  const guardado = await Store.cargar();
  db = {
    pacientes: (guardado && guardado.pacientes) || [],
    consultas: (guardado && guardado.consultas) || [],
    config: Object.assign({}, CONFIG_DEF, (guardado && guardado.config) || {}),
    configMod: (guardado && guardado.configMod) || 0,
    borrados: (guardado && guardado.borrados) || {},
    avisos: (guardado && guardado.avisos) || {}
  };
  // Los códigos del bloque CONSULTORIO mandan sobre lo guardado: así, si se
  // corrigen en el archivo, se corrigen en todos los dispositivos al recargar.
  if (CONSULTORIO.clienteId && db.config.driveId !== CONSULTORIO.clienteId){
    db.config.driveId = CONSULTORIO.clienteId; selloConfig();
  }
  if (CONSULTORIO.hojaId && db.config.hojaId !== CONSULTORIO.hojaId){
    db.config.hojaId = CONSULTORIO.hojaId; selloConfig();
  }
  /* Los pacientes cargados antes de separar los campos tienen el nombre entero
     en `nombre`. Se parte una sola vez: el primer término queda de nombre y el
     resto de apellido. Si quedó mal, se corrige en la ficha. */
  let migrados = 0;
  db.pacientes.forEach(p=>{
    if (p.apellido === undefined){
      const partes = String(p.nombre||"").trim().split(/\s+/);
      p.nombre = partes.shift() || "";
      p.apellido = partes.join(" ");
      sello(p); migrados++;
    }
  });
  if (migrados) await Store.guardar(db);

  if (!db.config.profId){
    db.config.profId = nuevoId() + nuevoId();
    selloConfig();
    await Store.guardar(db);
  }
  render();
  Sync.marcar(db.config.driveId ? "listo" : "off");

  // Tocar el estado del encabezado reconecta (el toque es lo que
  // permite abrir la ventana de Google en Safari) o lleva a Ajustes.
  $("#sincEstado").addEventListener("click", ()=>{
    if (Sync.activo()){ Sync.correr(true); return; }
    irA("ajustes"); window.scrollTo(0,0); render();
  });

  if (db.config.driveId) setTimeout(()=> Sync.correr(false), 800);
  if (db.config.hojaId) setTimeout(()=> Salas.correr(false), 1600);
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")){
    navigator.serviceWorker.register("sw.js").catch(()=>{});
  }
})();
</script>
